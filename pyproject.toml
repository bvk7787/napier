[build-system]
requires = ["hatchling>=1.27"]     # PEP 639 license and license-files
build-backend = "hatchling.build"

[project]
name = "napier"
version = "0.1.2"
description = "Your gear's manuals and your Eurorack rack in one place: page-cited lookups and checked what-if rack layouts, as a CLI and an MCP server for your AI assistant"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "The napier authors"}]
requires-python = ">=3.11"
keywords = ["manuals", "synthesizer", "eurorack", "music-hardware", "mcp", "search", "citations", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pypdfium2>=4.30",
]

[project.urls]
Homepage = "https://github.com/bvk7787/napier"
Repository = "https://github.com/bvk7787/napier"
Documentation = "https://github.com/bvk7787/napier#readme"
Issues = "https://github.com/bvk7787/napier/issues"
Changelog = "https://github.com/bvk7787/napier/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# semantic search: Docling parsing, LanceDB index, sentence-transformers embeddings + reranker
index = [
    "docling>=2.130",
    "lancedb>=0.39",
    "sentence-transformers>=5.0",
]
# 1.23 and later: the fixes for the SDK's published advisories (napier serves over stdio only)
mcp = ["mcp>=1.23"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "mcp>=1.23",          # the MCP server's tests
]

[project.scripts]
napier = "napier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/napier"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "examples/", "facts/", "specs/", "catalog/", "sources.yaml",
           "README.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md", "SECURITY.md",
           "SUPPORT.md", "CODE_OF_CONDUCT.md", "CONTRIBUTING.md", "AGENTS.md", "CITATION.cff",
           "pyproject.toml", "uv.lock", ".github/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["napier"]

[tool.coverage.report]
skip_empty = true

[tool.mypy]
# A lenient start, as in Fourier: mypy's defaults check only annotated functions, and the codes that
# only ask for more annotations are off. warn_unused_ignores flags an ignore once it's no longer needed.
python_version = "3.11"
files = ["src/napier"]
ignore_missing_imports = true
disable_error_code = ["var-annotated", "annotation-unchecked"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731"]   # small named lambdas read fine in this code

[tool.ruff.lint.per-file-ignores]
"src/napier/viewer.py" = ["E501"]   # the page's embedded CSS and JavaScript
