  status: changelog
  source: wmd_metron_firmware_notes
  q: Which Metron firmware fixes losing Voltera save files?
  anchors:
  - Fixes a Voltera session save bug
- id: metron-175-clock-out-always
  claim: Metron 1.75 added the Clock Out Always global option
  status: changelog
  source: wmd_metron_firmware_notes
  q: Can Metron keep sending clock while the sequencer is paused?
  anchors:
  - new global option for Clock Out Always
- id: metron-174-critical
  claim: Metron v1.74 fixed a critical bug that could delete saved sessions
  status: changelog
  source: wmd_metron_firmware_notes
  q: Which Metron firmware fixed sessions being deleted?
  anchors:
  - fixes a critical bug that could delete saved sessions
