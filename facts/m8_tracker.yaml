- id: m8-pool-reorder
  claim: In the Instrument Pool, EDIT+UP/DOWN on the instrument name column moves the instrument up or down the list
  status: manual
  source: m8_tracker_manual
  pages: [23]
  q: How do I move an instrument up or down the instrument list on the M8?
  anchors: ["On the instrument name column, move the current instrument up or down on the instrument list"]
- id: m8-swing
  claim: Groove 07,05 or 08,04 gives a common swing
  status: manual
  source: m8_tracker_manual
  pages: [26]
  q: What groove values give swing on the M8?
  anchors: ["A common swing setting is 07,05 or 08,04"]
- id: m8-cha
  claim: CHA's first digit sets the odds for everything to its left, the second for everything to its right
  status: manual
  source: m8_tracker_manual
  pages: [69]
  q: How does the CHA chance command work?
  anchors: ["CHA1F", "10% chance"]
- id: m8-arp-intervals
  claim: ARP37 on C-4 plays C-4, D#4 and G-4 (semitones, without a scale)
  status: manual
  source: m8_tracker_manual
  pages: [69]
  q: What notes does ARP37 play?
  anchors: ["ARP37", "D#4 (+3), and G-4 (+7)"]
- id: m8-hop-table
  claim: In a table, HOP jumps to a row; in a phrase, HOPFF stops the track
  status: manual
  source: m8_tracker_manual
  pages: [70]
  q: What does HOP do in a table?
  anchors: ["HOPFF stops playback of the current track", "In table: Jumps the play position"]
- id: m8-table-tic
  claim: TABLE TIC sets the instrument's table speed; default 01, one tick per step
  status: manual
  source: m8_tracker_manual
  pages: [16]
  q: What does TABLE TIC do and what is its default?
  anchors: ["TABLE TIC", "one tick per table step"]
- id: m8-detune-center
  claim: DETUNE 80 is the center; first digit steps semitones, second steps 1/16 semitone
  status: manual
  source: m8_tracker_manual
  pages: [55]
  q: What is the center value of sample DETUNE?
  anchors: ["80", "being the center frequency"]
- id: m8-repitch
  claim: REPITCH/BPM pitches a sample to the song tempo, set with the STEPS/BPM parameter
  status: manual
  source: m8_tracker_manual
  pages: [54]
  q: How does the REPITCH play mode work?
  anchors: ["REPITCH/BPM - Pitches the sample based on the current song tempo"]

# ---- from the firmware changelog
- id: m8-sli-2-5
  claim: The Sampler SLI command arrived in 2.5.0, not 6.0
  status: changelog
  source: m8_tracker_changelog
  cite: https://github.com/Dirtywave/M8Firmware/blob/main/changelog.txt
  q: which M8 firmware added the sampler SLI command
  anchors:
  - Sampler SLI command for cuing specific slice markers from file
- id: m8-repitch-6-0
  claim: REPITCH play modes and the NXT command arrived in 6.0.0
  status: changelog
  source: m8_tracker_changelog
  cite: https://github.com/Dirtywave/M8Firmware/blob/main/changelog.txt
  q: when did the M8 get REPITCH play modes and the NXT command
  anchors:
  - PLAY:REPITCH modes to lock sample length to song tempo
  - NXT fx command - Triggers specified instrument on the adjacent track
- id: m8-a440
  claim: A-4 is A440, so M8 note names follow standard octave numbering (C-4 is middle C)
  status: changelog
  source: m8_tracker_changelog
  cite: https://github.com/Dirtywave/M8Firmware/blob/main/changelog.txt
  q: what octave numbering do M8 note names use
  anchors:
  - A-4 is now A440
- id: m8-scale-view-location
  claim: The Scale view sits above Groove on the view map
  status: changelog
  source: m8_tracker_changelog
  cite: https://github.com/Dirtywave/M8Firmware/blob/main/changelog.txt
  q: where is the Scale view on the M8 view map
  anchors:
  - Scale and microtonal support, new view can be found above groove
  notes: The manual's View Layout diagram agrees
- id: m8-song-backups
  claim: Saving over a song keeps the previous version in a Backup folder (6.2.0+)
  status: changelog
  source: m8_tracker_changelog
  cite: https://github.com/Dirtywave/M8Firmware/blob/main/changelog.txt
  q: does the M8 keep a backup when I save over a song
  anchors:
  - When a song is overwritten, the previous version is saved in [path]/Backup
- id: m8-clone-instruments
  claim: In Song view, a third EDIT in a clone also clones the instruments used (6.6.1+)
  status: changelog
  source: m8_tracker_changelog
  cite: https://github.com/Dirtywave/M8Firmware/blob/main/changelog.txt
  q: how do I clone the instruments used in a Song view selection on the M8
  anchors:
  - SELECT+EDIT a third time also clones instruments used in the selection

# ---- from the tips doc
- id: m8-sort-fixes-glitches
  claim: Sorting a folder in the file browser (SHIFT+OPTION) fixes glitchy playback from it
  status: community
  source: m8_tracker_tips
  q: how do I fix glitchy sample playback on the M8
  anchors:
  - do a directory sort (SHIFT + OPTION)

# ---- more from the changelog and the tips doc
- id: m8-cl-660-sd-firmware-flash
  claim: Firmware 6.6.0 added flashing new firmware from the SD card via System Settings, working on 6.6 and up.
  status: changelog
  source: m8_tracker_changelog
  q: can I update M8 firmware from the SD card without a computer
  anchors:
  - Flash firmware from SD card via System Settings
- id: m8-cl-660-hypersynth-shape
  claim: Firmware 6.6.0 added a Shape parameter to Hypersynth with waveforms like SAW, DARK SAW, SINE FOLD and SINE
    ORGAN.
  status: changelog
  source: m8_tracker_changelog
  q: which M8 firmware added the Hypersynth Shape parameter
  anchors:
  - Hypersynth - Shape parameter (SAW, SOFT SAW, DARK SAW
- id: m8-cl-662-eq-spectrum-stereo
  claim: Firmware 6.6.2 made the EQ View spectrum show both left and right channels instead of left only.
  status: changelog
  source: m8_tracker_changelog
  q: does the M8 EQ spectrum analyzer show both channels
  anchors:
  - Spectrum now includes left and right (was left only)
- id: m8-tip-timestretch-breaks
  claim: To time-stretch a break, set the sampler to FWDLOOP with LENGTH 00 and drive LOOP ST with a RAMP UP LFO
    on RETRIG, with FRQ 10 per bar.
  status: community
  source: m8_tracker_tips
  q: how do I time stretch a drum break loop on the M8
  anchors:
  - adjust to bar length. 1 bar = 10 (16 steps), 2 bars = 20 (32 steps)
- id: m8-tip-tape-stop
  claim: A tape stop effect uses PIT to set the starting pitch and PSL on the next row to slide to a lower target
    pitch, with velocity ramping volume.
  status: community
  source: m8_tracker_tips
  q: how do I make a tape stop effect on M8
  anchors:
  - Use a combo of PIT and PSL on a sample instrument
- id: m8-tip-round-robin-slices
  claim: Round robin drums can be made by putting variations in one sliced WAV and using a TIC 00 table whose note
    offset column steps to the next slice each hit.
  status: community
  source: m8_tracker_tips
  q: can I do round robin drum samples on the M8
  anchors:
  - an increasing number each time to auto jump to next slice
- id: m8-tip-tap-tempo
  claim: With the Tempo parameter highlighted on the Project page, tapping EDIT sets a tapped tempo.
  status: community
  source: m8_tracker_tips
  q: is there tap tempo on the M8
  anchors:
  - tapping [ EDIT ] will allow you to insert a tapped tempo
