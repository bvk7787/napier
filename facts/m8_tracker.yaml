# Facts for m8_tracker. Managed by `napier facts` (hand edits are fine; comments other than this
# header are not kept when napier rewrites the file).
# status: manual | changelog | community | hardware | unverified | refuted
# pages are printed page numbers in `source`. q + anchors make the fact an eval case.

# ---- from the manual (eval cases)
- id: m8-wav-only
  claim: The Sampler loads only 1 or 2 channel PCM .wav files
  status: manual
  source: m8_tracker_manual
  pages: [54]
  q: What sample file formats does the M8 Sampler support?
  anchors: ["Only 1 or 2 channel (stereo)", "PCM .wav files are supported"]
- id: m8-streaming
  claim: Samples stream from the SD card instead of loading into memory
  status: manual
  source: m8_tracker_manual
  pages: [4]
  q: Does the M8 load samples into RAM?
  anchors: ["streamed directly from the SD card", "not read from memory"]
- id: m8-bitdepth
  claim: Convert 32 or 24-bit samples to 16 or 8-bit where possible
  status: manual
  source: m8_tracker_manual
  pages: [4]
  q: What bit depth should samples be for M8 playback?
  anchors: ["Convert 32-bit or 24-bit samples to 16-bit or 8-bit"]
- id: m8-mono-kicks
  claim: Convert stereo samples to mono where stereo isn't needed, such as kicks
  status: manual
  source: m8_tracker_manual
  pages: [4]
  q: Should kick drums be mono on the M8?
  anchors: ["Convert stereo samples to mono where stereo is not necessary", "Kick"]
- id: m8-slice-markers
  claim: A sample can hold up to 128 slice markers, stored in the wav file
  status: manual
  source: m8_tracker_manual
  pages: [57]
  q: How many slice markers can an M8 sample have?
  anchors: ["up to 128 markers that are stored within the wav file"]
- id: m8-render
  claim: Renders are 16-bit 44.1 kHz stereo wav files in /Renders
  status: manual
  source: m8_tracker_manual
  pages: [47]
  q: What format does the M8 render audio to?
  anchors: ["16-bit 44.1kHz stereo wav file", "/Renders"]
- id: m8-instruments
  claim: A song has 128 instruments
  status: manual
  source: m8_tracker_manual
  pages: [16]
  q: How many instruments does an M8 song have?
  anchors: ["128 instruments available per song"]
- id: m8-pitch-limit
  claim: Sample pitch has an upper limit that depends on bit depth and channel count, because of streaming
  status: manual
  source: m8_tracker_manual
  pages: [54]
  q: Why is there an upper pitch limit on M8 samples?
  anchors: ["upper-pitch limitation enforced based on bit-depth"]
- id: m8-path-limit
  claim: A sample's whole path must be under 128 characters
  status: manual
  source: m8_tracker_manual
  pages: [67]
  q: What is the maximum sample path length on the M8?
  anchors: ["The entire path length of the sample is under 128 characters"]
- id: m8-accepted-depths
  claim: Samples can be 8, 16, 24 or 32-bit, mono or stereo, uncompressed PCM
  status: manual
  source: m8_tracker_manual
  pages: [67]
  q: Which sample bit depths will the M8 load?
  anchors: ["Sample is 8,16, 24, or 32 bit and is mono or stereo"]

# ---- workflow facts for chopping and playing breaks
- id: m8-live-cue-row
  claim: LEFT+PLAY in Song view cues the whole selected song row
  status: manual
  source: m8_tracker_manual
  pages: [11]
  q: How do I cue a whole song row at once in live mode?
  anchors: ["[LEFT]+[PLAY] Cue the selected song row"]
- id: m8-live-stop-track
  claim: SHIFT+PLAY in Live mode stops a cued or playing track
  status: manual
  source: m8_tracker_manual
  pages: [11]
  q: How do I stop one track in live mode?
  anchors: ["In live mode - Stop a cued or playing track"]
