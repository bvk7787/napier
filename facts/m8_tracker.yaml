- id: m8-mixer-snapshot
  claim: In Mixer, SHIFT+OPTION stores a snapshot of the whole song and SHIFT+EDIT recalls it
  status: manual
  source: m8_tracker_manual
  pages: [31]
  q: How do I take a snapshot of the song in the mixer?
