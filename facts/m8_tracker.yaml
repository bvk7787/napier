  claim: LIVE QUANTIZE in Project sets when cued chains start
  status: manual
  source: m8_tracker_manual
  pages: [38]
  q: Where do I set when a cued chain starts playing in live mode?
  anchors: ["LIVE QUANTIZE", "cue-waiting behavior"]
- id: m8-deep-clone
  claim: SHIFT+OPTION then double-tap EDIT in Song view clones a chain and all its phrases
  status: manual
