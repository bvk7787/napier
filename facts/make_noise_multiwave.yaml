  status: changelog
  source: make_noise_multiwave_firmware_notes
  q: What is the lime green Cross Mod mod shape on MultiWAVE?
  anchors:
  - 'New Mod Shape: Cross Mod'
- id: mw-435-scala
  claim: 'Firmware 4.3.5 added Scala quantize: the SD card gets a scala folder with eight default .scl files'
  status: changelog
  source: make_noise_multiwave_firmware_notes
  q: Can MultiWAVE quantize to Scala tunings, and where do the scl files go?
  anchors:
