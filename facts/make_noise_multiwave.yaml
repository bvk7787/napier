- id: mw-435-midi-scala
  claim: In Scala mode MIDI notes are quantized to the selected file; MPE and pitch bend are not
  status: changelog
  source: make_noise_multiwave_firmware_notes
  q: Does MultiWAVE Scala quantize apply to incoming MIDI notes?
  anchors:
  - MIDI notes are quantized according to the scala file
