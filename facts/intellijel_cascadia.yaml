  claim: Firmware 1.4.4.0 fixed the LFV freezing under extreme modulation
  status: changelog
  source: intellijel_cascadia_firmware_notes
  q: Which Cascadia firmware fixed the LFV freezing with heavy modulation?
  anchors:
  - LFV Freezing up at with extreme modulation
- id: cas-1430-velocity
  claim: Firmware 1.4.3.0 fixed velocity arriving late on some settings
  status: changelog
  source: intellijel_cascadia_firmware_notes
  q: Was there a Cascadia firmware fix for delayed MIDI velocity?
  anchors:
  - Velocity value was delayed on certain settings
