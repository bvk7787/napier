# ---- workflow facts for chopping and playing breaks
- id: dt-linear-locks
  claim: CREATE LINEAR LOCKS assigns slices to placed note trigs in order, from slice one
  status: manual
  source: digitakt_2_manual
  pages: [99]
  q: How do I assign slices to trigs in order on the Digitakt II?
  anchors: ["CREATE LINEAR LOCKS automatically applies any created slices linearly"]
- id: dt-temp-save
  claim: TEMPORARY SAVE and RELOAD PATTERN are for live improvising and don't save permanently
  status: manual
  source: digitakt_2_manual
  pages: [50]
  q: How do I take a restore point of a pattern while improvising?
  anchors: ["TEMPORARY SAVE PATTERN and TEMPORARY RELOAD PATTERN commands are"]
- id: dt-delay-time
  claim: Delay TIME is relative to BPM and measured in 128th notes
  status: manual
  source: digitakt_2_manual
  pages: [61]
  q: What unit is the Digitakt II delay TIME in?
  anchors: ["measured in 128th notes"]
- id: dt-sidechain
  claim: The compressor's SCS sets the sidechain source, such as the kick's track
  status: manual
  source: digitakt_2_manual
  pages: [64]
  q: How do I sidechain the compressor to the kick on the Digitakt II?
  anchors: ["Sidechain Source decides what audio source the compressor analyzes"]
- id: dt-keyboard-setup
  claim: FUNC+KEYBOARD opens KEYBOARD SETUP (scale, root note, fold)
  status: manual
  source: digitakt_2_manual
  pages: [13]
  q: Where do I set the keyboard scale and fold on the Digitakt II?
  anchors: ["KEYBOARD SETUP", "scale, root note, and keyboard fold"]
- id: dt-bars
  claim: On REPITCH and STRETCH, BARS sets the sample's total length in bars, relative to BPM
  status: manual
  source: digitakt_2_manual
  pages: [95, 96, 97]
  q: What does the BARS parameter do on the Digitakt II?
  anchors: ["Bars sets the total duration of the sample measured in bars"]

# ---- community claims and open questions
- id: dt-bars-values
  claim: BARS only offers 1, 2, 4 and 8
  status: community
  notes: Reported by Digitakt II users on Elektronauts.
- id: dt-strt-len-range
  claim: STRT and LEN run 0 to 120 across the file
  status: community
  notes: Forum reports.
- id: dt-repitch-tune
  claim: The REPITCH machine has no TUNE parameter
  status: unverified
  source: digitakt_2_manual
  notes: The manual lists none; midi.guide lists one.
- id: dt-trig-len-two-bars
  claim: Trig LEN shows two bars as "2", and AMP HOLD NOTE lets one trig play a 2-bar REPITCH loop
  status: unverified
- id: dt-legato-ties
  claim: SETUP > TRACK > LEGATO ties overlapping sequencer notes
  status: unverified
- id: dt-slice-tune-resolution
  claim: TUNE on the SLICE machine can reach +2.44 or +2.45 semitones
  status: unverified
- id: dt-empty-src-knobs
  claim: Which SRC knobs (C, G) are empty on each machine, and the AMP page layout
  status: unverified
- id: dt-ptim-port-knobs
  claim: PTIM and PORT sit on knobs G and H of TRIG page 2
  status: unverified
- id: dt-vel-audio-level
  claim: Trig VEL changes an audio track's level by default
  status: unverified
  notes: If velocity doesn't change the level, lock AMP VOL instead.
- id: dt-transfer-folder-name
  claim: Samples dropped onto Transfer's Drop page land in a dated /transfers-YYMMDD folder and are auto-converted
    to the device's native format.
  status: manual
  source: elektron_transfer_manual
  pages:
  - 8
  q: what folder do samples go in when I drop them on the Transfer Drop page
  anchors:
  - Transfer creates a target folder with the name /transfers-YYMMDD
- id: dt-transfer-sysex-os-recovery
  claim: If Transfer can't detect the device, the SYSEX TRANSFER page can upgrade the OS, including from the device's
    EARLY STARTUP menu via a MIDI interface.
  status: manual
  source: elektron_transfer_manual
  pages:
  - 6
  q: how do I update the Digitakt OS when Transfer won't detect it
  anchors:
  - click 'OS Upgrade via device startup menu' and then follow the instructions
- id: dt-transfer-edited-wav-hash
  claim: Backed-up samples are bit-accurate wav files, and editing them changes their hash so the device projects
    can no longer match them.
  status: manual
  source: elektron_transfer_manual
  pages:
  - 10
  q: what happens if I edit backed up sample wav files from Transfer before sending them back
  anchors:
  - Should you edit the files, they end up with a different hash sum
- id: dt-transfer-dtprj-export
  claim: Transfer can export a whole project as a single .dtprj file containing pattern data and all samples used.
  status: manual
  source: elektron_transfer_manual
  pages:
  - 4
  q: how do I share a Digitakt project with all its samples as one file
  anchors:
  - a project can be exported as a single file containing all project and pattern data

