# ---- from the manual
- id: dt-drive-size
  claim: The +Drive holds 20 GB
  status: manual
  source: digitakt_2_manual
  pages: [29]
  q: How much sample storage does the Digitakt II +Drive have?
  anchors: ["total size of the +Drive is 20 GB"]
  alt: [["sample bank that can hold up to 20 GB"]]
- id: dt-project-ram
  claim: A project loads up to 400 MB of samples (about 72 min mono, 36 min stereo)
  status: manual
  source: digitakt_2_manual
  pages: [17, 29]
  q: How much sample memory can a Digitakt II project load?
  anchors: ["400 MB", "72 minutes in mono, 36 minutes in stereo"]
- id: dt-slots
  claim: A project has 1016 sample slots
  status: manual
  source: digitakt_2_manual
  pages: [17]
