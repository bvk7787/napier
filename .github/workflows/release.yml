name: Release

# A version tag (v0.1.0) builds the package and publishes it to PyPI with Trusted Publishing:
# no token is stored anywhere. PyPI trusts this workflow once the project's trusted publisher
# names it (github.com/bvk7787/napier, workflow release.yml, environment pypi).
# The tag must match the version in pyproject.toml. Nothing runs while the repository is private.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME, pyproject says $want"; exit 1; }
      - name: Build the sdist and wheel
        run: |
          uv build
          uvx --from twine==7.0.0 twine check --strict dist/*
      - name: The wheel installs and runs
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/v" --python "$(command -v python)"
          uv pip install --python "$RUNNER_TEMP/v/bin/python" dist/*.whl
          "$RUNNER_TEMP/v/bin/napier" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ !github.event.repository.private && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/napier/
    permissions:
      id-token: write            # Trusted Publishing: PyPI checks this workflow's identity
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
