name: Bug report
description: Something napier did wrong, or a crash
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please leave out personal details (names, paths with your user name,
        your own notes) and don't attach manuals. A security problem goes to the private form
        instead: Security tab, "Report a vulnerability".
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it did. Paste the error or traceback if there was one.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: napier --version
      placeholder: napier 0.1.0 (from /path/to/napier)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: macOS 15.3 (Apple silicon), Python 3.12.8
    validations:
      required: true
  - type: input
    id: extras
    attributes:
      label: Extras installed
      placeholder: none, index, mcp
