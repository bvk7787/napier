# Module catalog: what napier knows about Eurorack modules, keyed by ModularGrid-style module slugs.
# Shared by every rack: a rack's racks/devices.yaml can add or override entries.
#   device  napier device whose docs cover the module (null: nothing to index; say why in `note`)
#   role    one of voice, filter, effect, rhythm, sequencer, modulation, utility, mixer, midi, expander
#   tags    finer categories (ModularGrid's vocabulary); the rack viewer colors modules by role
#   parent  for expanders: the module it attaches to (the pairs-adjacent rule keeps them side by side)
# A racked slug missing here shows up as "unmapped" in `rack sync`: add its manual, then map it.

