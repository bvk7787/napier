notes: >-
  Main 42hp module only; the manual's "32 individual patch points" (p6) all appear here. The 6hp ATLX
  expander's 16 jacks are a separate spec. VCO A and VCF both label jacks "FM 1 IN"/"FM 2 IN", so names
  are prefixed. Fixed normals encoded; switch-dependent normals left as notes: SYNC A IN gets VCO B saw
  or GATE (SYNC A SOURCE), PWM IN source set by PWM SOURCE switch, AUX 1 IN gets VCO A tri or VCO B
  square, AUX 2 IN gets VCO A sine or VCO B saw, S&H HOLD gets VCO B square or GATE (HOLD SOURCE),
  S&H SAMP defaults to internal white noise, VCF FM 2 tracks the pitch input, PITCH B is summed with
  PITCH A in A+B mode. LEVEL Input expects 0-5V (5V normalled); ENVELOPE Out 0-5V, INVERSE 0 to -5V;
  OUT max 10Vpp. Manual gives no +5V draw. Power matches ModularGrid (140/138 mA).
