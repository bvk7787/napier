device: divkid_ochd_expander
slugs: [divkid-ochd-expander]
source: divkid_ochd_expander_manual
hp: 4
hp_page: 4
hp_anchor: "Width: 4 HP"
power:
  plus12: 5
  minus12: 5
  page: 4
  anchor: "+12V: 5mA"
jacks:
  - {name: "LFO 1 full wave rectifier", dir: out, type: cv, page: 5}
  - {name: "LFO 3 full wave rectifier", dir: out, type: cv, page: 5}
  - {name: "LFO 5 full wave rectifier", dir: out, type: cv, page: 5}
  - {name: "LFO 7 full wave rectifier", dir: out, type: cv, page: 5}
  - {name: "LFO 2 and LFO 3 OR logic", dir: out, type: cv, page: 5}
  - {name: "LFO 2 and LFO 3 AND logic", dir: out, type: cv, page: 5}
  - {name: "LFO 6 and LFO 7 OR logic", dir: out, type: cv, page: 5}
  - {name: "LFO 6 and LFO 7 AND logic", dir: out, type: cv, page: 5}
  - {name: "LFO 2 trigger signal output", dir: out, type: trigger, page: 5}
  - {name: "LFO 4 trigger signal output", dir: out, type: trigger, page: 5, normal: "LFO 2 trigger signal output"}
  - {name: "LFO 6 trigger signal output", dir: out, type: trigger, page: 5, normal: "LFO 4 trigger signal output"}
  - {name: "LFO 8 trigger signal output", dir: out, type: trigger, page: 5, normal: "LFO 6 trigger signal output"}
  - {name: "LFOs 1, 2, 3, 4 DAC output", dir: out, type: cv, page: 5}
  - {name: "LFOs 5, 6, 7, 8 DAC output", dir: out, type: cv, page: 5}
  - {name: "LFOs 1, 3, 5, 7 DAC output", dir: out, type: cv, page: 5, label: "LFOs 1, 3, 5, 7 DAC ouput"}
  - {name: "LFOs 2, 4, 6, 8 DAC output", dir: out, type: cv, page: 5}
notes: >-
  Instruo [o]4^2 expander for ochd; 16 outputs, no inputs (all sources come from ochd via two rear
  2x4 expander headers, not listed). Names are the panel key on p5. Rectifiers 0-5V, logic pairs +/-5V,
  triggers ~8ms. Trigger outputs cascade clockwise (p8): each later trigger output carries the previous
  one's triggers when that previous output is unpatched; normal fields record that chain.
  Manual typo "DAC ouput" for key 15 is used as the label. Power matches ModularGrid (5/5 mA).
