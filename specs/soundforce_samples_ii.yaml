notes: >-
  Inputs are labelled "I" and outputs "O" on the panel, one per channel (5 channels); names are constructed
  per channel. Inputs take 0 to 5V triggers/gates (up to 12V tolerated). Any unpatched output 1-4 is summed
  into the channel 5 output jack (MIX out). Inputs 2 and 4 can optionally track an LFO frequency to modulate
  playback speed of channels 1 and 3 (settings file). The front USB-A port is for USB memory sticks only.
  Power from manual (85mA +12V, 11mA -12V) disagrees with ModularGrid (135/15). +5V not stated.
