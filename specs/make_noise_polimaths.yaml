power:
  plus12: 230
  minus12: 5
  page: 5
  anchor: "230mA of +12VDC and 5mA of -12VDC"
jacks:
  - {name: "Activate IN", dir: in, type: gate, page: 8, label: "Activate Input"}
  - {name: "Span CV IN", dir: in, type: cv, page: 8, label: "Span CV Input"}
  - {name: "Accumulate IN", dir: in, type: gate, page: 8, label: "Accumulate Input"}
  - {name: "Channel Index OUT", dir: out, type: cv, page: 8, label: "Channel Index Ouput"}
  - {name: "Spread CV IN", dir: in, type: cv, page: 8, label: "Spread CV Input"}
  - {name: "Curve CV IN", dir: in, type: cv, page: 9, label: "Curve CV Input"}
  - {name: "Rise CV IN", dir: in, type: cv, page: 9, label: "Rise CV Input"}
  - {name: "Fall CV IN", dir: in, type: cv, page: 9, label: "Fall CV Input"}
  - {name: "Shape CV IN", dir: in, type: cv, page: 10, label: "Shape CV Input"}
  - {name: "Strength CV IN", dir: in, type: cv, page: 10, label: "Strength CV Input"}
  - {name: "Rate CV IN", dir: in, type: cv, also: [pitch], page: 10, label: "Rate CV Input"}
  - {name: "Osc CV IN", dir: in, type: cv, page: 10, label: "Osc CV Input"}
  - {name: "Cycle IN", dir: in, type: gate, page: 11, label: "Cycle Input"}
  - {name: "Reset IN", dir: in, type: trigger, also: [gate], page: 11, label: "Reset Input"}
  - {name: "Channel OUT 1", dir: out, type: cv, also: [audio], page: 11, label: "Channel Outputs 1-8"}
  - {name: "Channel OUT 2", dir: out, type: cv, also: [audio], page: 11, label: "Channel Outputs 1-8"}
  - {name: "Channel OUT 3", dir: out, type: cv, also: [audio], page: 11, label: "Channel Outputs 1-8"}
  - {name: "Channel OUT 4", dir: out, type: cv, also: [audio], page: 11, label: "Channel Outputs 1-8"}
  - {name: "Channel OUT 5", dir: out, type: cv, also: [audio], page: 11, label: "Channel Outputs 1-8"}
  - {name: "Channel OUT 6", dir: out, type: cv, also: [audio], page: 11, label: "Channel Outputs 1-8"}
  - {name: "Channel OUT 7", dir: out, type: cv, also: [audio], page: 11, label: "Channel Outputs 1-8"}
