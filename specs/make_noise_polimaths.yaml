notes: >-
  Power matches ModularGrid (230/5 mA); +5V not stated. Jack names follow the Panel Controls pages
  (p8-11); the manual misspells "Channel Index Ouput". Activate, Accumulate, Cycle and Reset are
  described as gate inputs; Reset acts on rising edge so it is typed trigger. Rate CV IN tracks
  1V/oct when its attenuverter is fully CW (p20). Channel outputs carry functions and audio-rate
  oscillations (p6) and can form submixes of unpatched channels to their left when SubMixing is on
  (p25). The rear output header for QXG is not a jack and is not listed.
