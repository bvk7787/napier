notes: >-
  22 jacks: 10 per channel (described generically as "... Jacks" for each channel, names constructed
  with ch 1/ch 2) plus global CLOCK INPUT and TRS type A MIDI INPUT. IN 1/IN 2 are AC (audio) or DC (CV)
  coupled per the INPUT TYPE switch; IN 2 is normalled to IN 1. SUMMED EOC OUTPUT sends a 50ms ~8V
  pulse. microSD socket is not a jack.
