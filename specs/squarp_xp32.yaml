notes: >-
  xp32 is a Hermod+ expander with 32 configurable CV outputs, organised as 8 tracks (TR1-TR8) of
  four outputs A B C D (p4, p6). Panel labels per jack are not printed in the text; names are
  TR<n> <output>. Each output is configurable as PITCH, GATE, VELO, MOD1-4, AFTC, CLCK or CC
  (p7), bipolar up to +/-10V (p5); defaults are PITCH, GATE, VELO, MOD. No input jacks; the
  8 track buttons are not jacks. Connects to Hermod+ via a 14-pin expander ribbon that "provides
  power to the expander" (p3); manual states no current draw or HP, so power and hp are omitted
  (ModularGrid lists 70/80/20mA, 14HP, unverified). Note the Hermod+ manual p95 says xp32 adds "24
  extra CV/Gate outputs", which conflicts with the xp32 manual's 32.
