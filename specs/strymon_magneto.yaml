notes: >-
  Power per spec table p21: +12V 210mA, -12V 210mA, +5V 0mA (matches ModularGrid). SPEED CV is
  calibrated 1V/oct over -3V to +3V. WET/REPEATS/SPRING are continuous CV (-5V to +5V) summed with
  their knobs. CLK IN, REC GATE, SHIFT, INFINITE, FORWARD/REVERSE, RESTART, PAUSE, TAP are 0-5V
  rising-edge trigger inputs; manual suggests a gate into RESTART and a clock into TAP/RESTART.
  With rear DIP S1 ON the transport CV jacks can instead drive the FEEDBACK ON/OFF buttons. CLK
  1-4 OUT are 50% duty clocks phase-aligned to clock/tap. Manual describes no MIDI or USB jack.
