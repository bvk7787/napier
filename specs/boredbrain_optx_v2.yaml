notes: >-
  Guide lists two power configs selected by rear jumper: (1) +5V generated on board (jumper OPTX):
  +12V 260mA, -12V 130mA (used here, matches ModularGrid); (2) +5V from case (jumper CASE): +12V 130mA,
  -12V 130mA, +5V 270mA. Rx/Tx are TOSLINK optical ADAT ports (type other). IN 1-8 accept audio and CV
  (per-pair AUDIO/CV mode switch); OUT 1-8 are DC-coupled audio/CV. Per-jack names constructed from
  "IN 1-8"/"OUT 1-8". Guide says EXT sync "requires a valid ADAT signal at the Tx jack", likely a typo for Rx.
