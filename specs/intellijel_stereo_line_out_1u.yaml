notes: >-
  1U (Intellijel format) module. Only two front-panel 1/8" jacks; the 1/4" TRS line outputs live on the separate
  Stereo Out Jacks 1U module (or a Palette/7U case jacks board) connected via rear 6-pin ribbon, and the 3-pin Link
  output is a rear connector, so neither is listed. Power figures are at maximum amplification; +5V not stated.
  Matches ModularGrid.
