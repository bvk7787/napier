notes: >-
  Manual describes jacks generically (x4) on pp. 15-16; channel numbering assumed. TRIG inputs act as
  clock inputs in LFO mode. CV inputs are freely assignable via the CV matrix and track 1V/oct; range +/-5V
  (accept up to +/-10V, clipped). Power +12V 106 mA, -12V 9 mA (no +5V stated). Qx expander (4hp, 8 mA +12V)
  is a separate module and its EOR/EOF outputs are not listed here. Matches ModularGrid.
