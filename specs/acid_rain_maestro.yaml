notes: >-
  Hardware overview (p.3) describes jacks generically: clock and reset inputs and outputs, plus a trigger input
  and signal output per channel (6 channels, p.2). Names are descriptive; the manual does not print per-jack
  labels in text. Clock/reset outputs inferred from "outputs (1) for the clock and reset" (changelog p.11 also
  mentions a clock output). Channel inputs put the channel in one-shot mode (rising edge of trigger or gate, p.8),
  also usable for sample-and-hold gating. Outputs 0 to +5V or -5V to +5V bipolar. Power +12V 65 mA, -12V 18 mA;
  +5V not stated. Matches ModularGrid.
