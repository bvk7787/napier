notes: >-
  1U (Intellijel) module. PULSE is a 5V gate; TRIG falls back to the internal pulse generator when
  unpatched; SAMPLE IN is normalled to WHITE noise; SLEW IN is normalled to HOLD. Noise outputs are
  documented as modulation sources too. Manual power (20 mA +12V, 15 mA -12V, no +5V stated) is lower
  than ModularGrid's 30/30 mA.
