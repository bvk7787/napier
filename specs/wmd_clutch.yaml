notes: >-
  HTML manual (no page numbers). CLSD/OPEN are trigger or gate (mode set in HIHAT.INI, trigger
  default). ACCENT and CHOKE are listed as trigger inputs; manual does not state their mode
  explicitly. Velocity is -5V to +5V by default; FX PRM 0-5V by default. Power: +82mA / -17mA,
  matches ModularGrid; +5V not stated. Memory card slot is not a jack.
