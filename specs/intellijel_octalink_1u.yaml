notes: >-
  Passive patchbay; manual says "CURRENT DRAW: None (passive module)", so all rails are 0.
  The eight numbered 1/8" jacks are described generically on p3 ("eight numbered jacks") and pass any
  signal (clocks, gates, CV, audio) bidirectionally to the like-numbered jack on the linked unit, so
  dir io / type other. The RJ45 port is a front-panel connector (FRONT PANEL [B]) linking two units.
  Package ships two identical modules; this spec describes one.
