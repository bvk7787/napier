notes: >-
  Names from the panel key (p5-6). Normals: each oscillator's sine is normalled to the other's FM Input
  (p14) and to "its corresponding" Multiply Input (p19); the manual ties the Modulator Input to
  Oscillator A (p20), so Carrier = Oscillator B is inferred. Switchable normals not encoded: Link Button
  cross-normals the two 1V/Oct Inputs (p13); Sync Button normals Osc A saw to Soft Sync Input (amber)
  or Osc B square to Hard Sync Input (white) (p18). Hard Sync is Osc A (2.5V threshold), Soft Sync is
  Osc B (2V threshold). Symmetry Bias Inputs can process external audio through the wavefolder (p16).
  Osc B PWM Output is a stepped triangle. No +5V draw stated. Power matches ModularGrid (200/80 mA).
