notes: >-
  Manual text is thin: it states 13 CV/audio inputs and 7 audio and CV/gate outputs (p.1) but the panel diagrams on
  pp.4-5 are images, so only jacks described in text are listed (10 inputs incl. the clock, 3 outputs plus the clock).
  Missing from the text: the trigger input that fires the voice, roughly two further inputs, and about three outputs
  (p.1 mentions "dedicated outputs for each WAVE and NOISE oscillator" but only WAVES and Noise are named). The
  wavescanner "clock I/O" (p.4; p.1 says an external clock or VCO can drive the scanner) is listed as one io jack
  because the text does not say whether it is one jack or a separate in and out. Names are descriptive where the
  manual gives no label. Pitch CV is analog and audio-rate modulation is encouraged (p.4). Scan freq CV is exponential.
  Power +12V 139 mA, -12V 115 mA (p.1); +5V not stated. Matches ModularGrid (29HP, 139/115).
