  plus12: 139
  minus12: 115
  page: 1
  anchor: "+139mA, -115mA @ 12V"
jacks:
  - {name: "ENABLE", dir: in, type: gate, also: [cv], page: 1, label: "The ENABLE input allows you to gate the wavescanner"}
  - {name: "SCAN FREQ CV", dir: in, type: cv, page: 1, label: "SCAN FREQ CV"}
  - {name: "Wavescanner Clock I/O", dir: io, type: clock, page: 4, label: "The clock I/O is accessible for use elsewhere"}
  - {name: "Pitch CV", dir: in, type: cv, also: [audio], page: 4, label: "adjust the pitch of both membrane waveforms at once with this control and CV input"}
  - {name: "Pitch Decay CV", dir: in, type: cv, page: 4, label: "Vary the amount and duration with the controls and CV input"}
  - {name: "Membrane Decay CV", dir: in, type: cv, page: 4, label: "Membrane decay - use the control and CV input"}
  - {name: "WAVE 1 audio input", dir: in, type: audio, page: 4, label: "WAVE 1 audio input"}
  - {name: "Snappy Pitch CV", dir: in, type: cv, page: 5, label: "change the pitch of the snappy noise generator with this control and the CV modulation input"}
  - {name: "Snappy Decay CV", dir: in, type: cv, page: 5, label: "by way of this control and modulation input"}
  - {name: "SNAPPY IN", dir: in, type: audio, page: 3, label: "plugging into the SNAPPY IN"}
