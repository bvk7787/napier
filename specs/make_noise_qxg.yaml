notes: >-
  Power matches ModularGrid (65/75 mA); +5V not stated. Signal Inputs 1-4 and Control Inputs 1-4 are
  normalled to rear N.U.S.S. Signal/Control input headers (not jacks), broken per channel by patching.
  Right Aux has no explicit normal statement; the manual says patching only the Left input gives mono
  at both Mix outputs, recorded as Right Aux normalled to Left (Mono) Aux. Patching a Channel output
  removes that channel from the Mix outputs.
