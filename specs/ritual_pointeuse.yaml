notes: >-
  1U module (Intellijel/Pulplogic). Controls page (p7) is image-only; jacks taken from the overview text.
  Trig In switches state above 2.5V (held in Mom mode, toggles in Latch mode). The switch is bidirectional
  and signal-agnostic; with nothing patched to In/Out, a 5V signal appears alternately at Out/In I and II.
  The footswitch pedal jack lives on the separate 4HP expander (not counted here). Rear FOOT, MASTER and
  SLAVE headers are not jacks.
