notes: >-
  Panel legend is in the raw text of p. 3 (diagram labels); per-channel count of 4 from "4 channels". Trigger
  output [1], Gate input [2] and Transpose input [4] are single shared jacks assignable to channels via the Edit
  menu (p. 5). Channel CV inputs react to triggers when a channel is in arpeggiator mode (p. 6); Gate input can be
  a Reset in for arpeggiated channels (p. 6). Outputs default to V/Oct, switchable to Hz/V or 1.2V/Oct (p. 10).
  Expander not covered. No +5V figure stated. Power matches ModularGrid.
