notes: >-
  Power omitted: page 3 gives only "Current Draw: ~120ma" on a +/-12V supply with no per-rail split
  (ModularGrid lists 120/60). The panel diagram (p6) is an image, so jack names are built from text:
  p5 says all jacks are CV inputs except the two VCO audio outputs; V/Oct, Inv and Fb inputs have no
  attenuators; Osc B Fb is normalled to the Osc A Feedback control (a knob, so no jack normal recorded).
  The 12 operator inputs (Wave, Multiplier, Level for operators 1-4) are inferred from p4 ("exposes all
  operator parameters to both voltage and direct control") and p9 ("controls and inputs for each of the
  4 operators"); the manual never names them individually. Whether Osc A has its own Fb jack is not
  stated; only the Osc B Fb input is listed. Algorithm select is a button with no CV input mentioned.
  Inputs expect 0-5V except Chord and V/Oct (approx 0-10V).
