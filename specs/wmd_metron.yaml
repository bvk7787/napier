notes: >-
  Web manual (no page numbers). Power is the stated maximum (typical is +12V 180mA); rear-connections
  section says no power is drawn from +5V or -12V. Front panel overview lists no jacks; the jack list
  comes from the Specs Inputs/Outputs sections: CLOCK IN, RESET IN, ASSGN1/2 IN (0-5V analog, used as
  gates and as CV for ROLL/LOOP), Channel Outputs 1-16 (0/10V gates or bursts; per-output names
  constructed), CLOCK OUT, RESET OUT (END/RST/PRE/RUN modes; RUN holds high). SyncBus header normals to
  CLOCK IN/RESET IN. USB Mini, SyncBus, EXP and S.Bus are rear connections and not listed.
