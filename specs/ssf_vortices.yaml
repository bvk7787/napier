notes: >-
  Manual cites 14 inputs and 7 outputs; all 14 audio inputs, 3 CV inputs (PAN CV for ch 1 and 4,
  X-FADE CV for ch 2/3) and 7 front-panel outputs listed. A rear stereo jack carrying a copy of MASTER MIX
  is excluded (rear). Stereo inputs and ST-AUX are L>R normalled. X-FADE direct out breaks ch 2/3 out of
  the mix outputs when patched. Per-side L/R and per-channel PAN CV names are constructed from the
  manual's generic descriptions. V-CV expander (2hp, 0mA) is a separate module and not listed. +5V not stated.
