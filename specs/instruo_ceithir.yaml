notes: >-
  Jack names from the panel key (p5); four filter channels named alpha, beta, gamma, delta (p7).
  Depth 27mm and -12V 390mA (p4); no +5V draw stated. ModularGrid lists 380/380mA and 30mm, so the
  manual draw is higher on both rails. Input of alpha normals to all other inputs; gamma Input normals
  to delta (p6). Strike Input pings on rising edges; audio-rate signals act like hard sync (p11).
  Patching a filter's Stereo Outputs removes it from the Master Stereo Outputs mix (p14).
  Level CV Inputs are unipolar positive (p18).
