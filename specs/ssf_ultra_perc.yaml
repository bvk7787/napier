notes: >-
  Power is a max figure (+/-125mA), matching ModularGrid; +5V not stated. Panel picture (p3) is an
  image; jacks come from text. p3 says every function except FM DEPTH is voltage controllable and the
  CV inputs sit on the bottom row. The LENGTH CV input is only evidenced by "LENGTH CV RANGE: ANY" in
  the tech info (p8); its panel label is not printed. N-TRIG is normalled from TRIG. No separate
  NOISE BIAS CV (p6: three CV inputs for the noise section: N-FREQ, N-DECAY, N-VCA); GAIN CV pairs
  with BODY BIAS. TRIG accepts audio-rate signals (bonus feature p7); EXT IN doubles as an alternate
  trigger input. DUCK outputs an inverted, offset ducking envelope.
