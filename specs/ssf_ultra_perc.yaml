  - {name: "TRIG", dir: in, type: trigger, also: [audio], page: 3, label: "TRIG input"}
  - {name: "N-TRIG", dir: in, type: trigger, page: 3, label: "N-TRIG jack normal", normal: "TRIG"}
  - {name: "DELAY CV", dir: in, type: cv, page: 3}
  - {name: "LENGTH CV", dir: in, type: cv, page: 8, label: "LENGTH CV RANGE"}
