  - {name: "V/OCT", dir: in, type: pitch, page: 5, label: "V/OCT CV input"}
  - {name: "DETUNE CV", dir: in, type: cv, also: [audio], page: 5, label: "DETUNE CV input"}
  - {name: "HARM CV", dir: in, type: cv, also: [audio], page: 5, label: "HARM CV input"}
  - {name: "B-DECAY", dir: in, type: cv, page: 5, label: "B-DECAY CV input"}
  - {name: "N-FREQ", dir: in, type: cv, page: 6, label: "N-FREQ CV input"}
  - {name: "N-DECAY", dir: in, type: cv, page: 6, label: "N-DECAY CV input"}
  - {name: "N-VCA", dir: in, type: cv, page: 6, label: "N-VCA CV input"}
