  - {name: "Mono Output (ch 1)", dir: out, type: audio, page: 12, label: "Mono Output", also: [cv]}
  - {name: "Mono Output (ch 2)", dir: out, type: audio, page: 12, label: "Mono Output", also: [cv]}
