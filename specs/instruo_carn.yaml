notes: >-
  Front panel key (p. 5) lists Primary Inputs, Secondary Inputs, Mono Outputs, Stereo Outputs and Level CV Input;
  per-channel jacks described generically on pp. 10-12. Secondary inputs: ch1 = pan CV, ch2 = unipolar VCA
  modulator (normalled to an internal +6V reference when unpatched), ch3 = bipolar ring-mod modulator, ch4 =
  crossfade second signal. Stereo Output L/R split assumed from "Stereo Outputs" (plural; p. 22 mentions "left
  Stereo Output"). Stereo Input/Output Back Jacks (p. 16) are rear-mounted and excluded. Manual gives +12V/-12V
  only; no +5V figure stated. Power matches ModularGrid.
