notes: "Manual states 230mA +12V / 5mA -12V; ModularGrid lists 250mA +12V (disagrees, manual used). No +5V stated. Activate is a gate input that also takes a clock in Parallel mode. Pitch Exponential Input (Osc A) tracks 1V/oct only when Follow is off and its attenuverter is fully CW. With Page 2 output mixing on, outputs 5-8 carry submixes. The USB-C jack is on the bottom left behind the panel (not front panel) and is excluded; the rear QXG output header is also excluded. 'Channel Index Ouput' is the manual's spelling."
