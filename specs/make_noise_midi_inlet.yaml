notes: >-
  Passive 2HP expander for MultiWAVE; manual says it requires no power, so all rails are 0. The only
  panel connector the manual names is the USB-C input (USB MIDI/MPE from a USB host, also used for
  firmware updates and wavetable upload). It connects to MultiWAVE with an included USB cable, which is
  a rear connection and not listed. The manual has no front-panel diagram text.
