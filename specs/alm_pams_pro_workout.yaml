notes: >-
  Power matches ModularGrid (60/10 mA); +5V not stated. Panel layout (p6) is an image only. Inputs
  from p19: the 4 upper external inputs 'Clk', 'Run', 'CV 1', 'CV 2' (0-5V). Clk can be set to
  clock, CV or next-bank trigger; Run to run gate, reset trigger, CV, prev-bank or rotate (p20).
  Eight outputs (p4, p5), 0-5V; per-output panel labels are not printed in the text, so names are
  generic. The USB-C port is on the left side of the PCB (p26), not the panel, and the MIDI-EX and
  EXPAND connectors are rear headers, so none are listed.
