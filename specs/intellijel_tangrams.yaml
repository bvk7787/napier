notes: >-
  Envelope 2 is documented only by reference (p10: "all the same inputs, outputs and parameter
  controls as Envelope 1", read ENV 1 as ENV 2); only ENV 2 GATE IN [2.A] is named explicitly (p15).
  ENV 2 RETRIG IN / LEVEL IN / OUT are therefore cited to the Envelope 1 jack descriptions (p9-10) and
  named by substitution. ENV 1 GATE IN is normalled to Envelope 2's gate; T1 CV IN normals to T2 CV IN.
  LEVEL IN jacks have 8V normalled internally and accept audio (built-in VCA). No +5V draw stated.
  Power matches ModularGrid (66/49 mA).
