notes: >-
  Manual identifies jacks only by callout numbers [1]-[4], no printed labels; names are
  descriptive. Dual 1x4 per the title and "duplicated across all 8 outputs"; the manual text says
  the lower section duplicates to "the other three jacks [4]", which conflicts with 1x4 and 8
  outputs, so 4 lower outputs are listed. Accepts audio or CV. Power per spec table: 4 mA @ +12V,
  4 mA @ -12V. ModularGrid lists -12V as 17mA, which disagrees with the manual; +5V not stated.
