notes: >-
  Web manual (no page numbers). Jack names derived from the Interface section's grouped labels
  (Inputs L/R 1-8, Inputs L/R A-B, MIDI A In/Out, Outputs L/R A-B, Output L/R). R inputs normal from L
  when unpatched. MIDI jacks are TRS MIDI type A. Out B becomes cue output when Cue is enabled.
  Power +12V 500 mA, -12V 250 mA; +5V not stated. Expando Expandi (8 CV inputs, 70 mA +12V) is a
  separate expander and its jacks are not listed here. Matches ModularGrid.
