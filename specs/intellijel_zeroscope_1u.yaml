notes: >-
  Inputs DC coupled, -10V to +10V, accept CV or audio. Each input is normalled through to its output
  (pass-through monitoring). Firmware updates are "over USB" (p13) but the manual does not show or name a
  front-panel USB port, so none is listed. +5V draw not stated.
