notes: >-
  Source is a thin retailer product page. It states 8HP, a 2164-based quad VCA with switchable lin/log response,
  DC-coupled inputs, and that "the audio and CV inputs are chain normalized from 1 to 4" (so each channel's input
  normals from the previous channel). It does not mention outputs at all, so the four VCA outputs (and any mix
  output) are not listed; jack list is incomplete. No current draw stated, so power is omitted (ModularGrid's
  50/50 mA unverified); the page only notes PSIpower with a non-polarized power header.
