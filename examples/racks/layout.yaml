# The example rack, written by hand (rack_source: file). One entry per module; `at` holds one
# position per copy, 'row N, hp N' counted from the top-left (row 1 is the 1U row, HP 1 is the left edge).
# Power is in mA from the maker's spec; napier also checks it against the manual where specs/ has one.
