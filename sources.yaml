# Documents in the napier store. `napier fetch` downloads them into ~/.napier/files;
# `napier ingest` extracts text (grep/read) and indexes chunks (search).
#
# kind: manual | changelog | community | note | code
# format: pdf | text | markdown | html | gdoc (Google Doc, exported as markdown) | github_releases
#   | discourse (a whole forum topic via /raw/<id>, one '## #N user (date)' per post)
# path: a local file instead of a url; relative paths are from this repo (notes/rack.md).
# sha256 pins a file: fetch and ingest refuse anything else (pin manuals; leave changelogs and
#   community docs unpinned, since they update in place).
# page_offset: printed page = PDF page - page_offset (`napier source offset <id>` detects it).
# heading: regex for section headings in plain-text sources (markdown formats use # headings).
# stop_at: cut a text source at the nth line matching regex (old copies in later tabs, etc.).
# start_at: drop everything before the nth line matching regex (a product page's changelog section),
#   so price or stock churn elsewhere on the page doesn't count as a change.
# check: false marks a one-time snapshot that `source check` never re-fetches (forum threads, pinned
#   code, and Google Drive files, since drive.google.com/uc is disallowed by robots.txt).
# Polite fetching: napier sends an honest user agent, obeys robots.txt (`source add` refuses
#   disallowed URLs), fetches each source at most once a run (weekly), spaces requests to a host
#   by 2 s, backs off on 429/503 per Retry-After, never follows links, and never logs in.
# Add new ones with `napier source add <url> --id ... --device ...`.

